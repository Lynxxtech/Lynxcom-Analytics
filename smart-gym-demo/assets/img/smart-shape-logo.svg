<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Smart Shape Fitness Gym Logo</title>
  <desc id="desc">Cute modern fitness logo with SS monogram, dumbbell, heart and brand text.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="0.55" stop-color="#c5301f"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="640" height="180" rx="42" fill="#080808"/>
  <g filter="url(#shadow)">
    <circle cx="92" cy="90" r="58" fill="url(#g)"/>
    <circle cx="92" cy="90" r="45" fill="#111" opacity="0.22"/>
    <path d="M59 78c7-18 35-21 45-5 8 13-2 24-19 26-18 2-27 9-23 20 5 14 33 14 44-2" fill="none" stroke="#fff3e7" stroke-width="10" stroke-linecap="round"/>
    <path d="M84 75c7-20 36-21 47-5 8 13-2 23-20 26-18 3-27 9-23 20 5 14 33 14 44-2" fill="none" stroke="#fff3e7" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
    <g transform="translate(50 128)">
      <rect x="0" y="-8" width="14" height="16" rx="4" fill="#fff3e7"/>
      <rect x="18" y="-5" width="56" height="10" rx="5" fill="#fff3e7"/>
      <rect x="78" y="-8" width="14" height="16" rx="4" fill="#fff3e7"/>
    </g>
    <path d="M122 45c5-9 20-6 20 6 0 11-13 18-20 25-7-7-20-14-20-25 0-12 15-15 20-6z" fill="#fff3e7" opacity="0.92"/>
  </g>
  <g fill="#fff3e7">
    <text x="178" y="78" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">SMART SHAPE</text>
    <text x="181" y="121" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffb15c" letter-spacing="6">FITNESS GYM</text>
    <text x="182" y="148" font-family="Inter, Arial, sans-serif" font-size="13" fill="#c9beb6" font-weight="700">Train stronger • Shape better • Stay consistent</text>
  </g>
